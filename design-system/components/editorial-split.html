<!-- @dsCard group="Components" name="Editorial Split" subtitle="Asymmetric image + text · alternating origin" viewport="960x600" -->
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GelByNoa — Editorial Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300&family=Assistant:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--porcelain:#F7F3EE;--bone:#EFE8DF;--ink:#211C18;--taupe:#8B8078;--rose-deep:#A9857A;
    --serif:"Frank Ruhl Libre",Georgia,serif;--sans:"Assistant",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--porcelain);padding:56px}
  .eyebrow{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--rose-deep);display:block;margin-bottom:2rem}
  .split{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:64px}
  .fig{aspect-ratio:4/5;overflow:hidden;background:var(--bone)}
  .ph{width:100%;height:100%;background:radial-gradient(120% 90% at 78% 18%,#EADFD5 0%,transparent 55%),radial-gradient(120% 120% at 15% 100%,#C9B4A6 0%,transparent 60%),linear-gradient(155deg,#E7D9CD 0%,#C7AFA1 48%,#9E8378 100%)}
  .num{font-family:var(--serif);font-size:1rem;color:var(--rose-deep);letter-spacing:.2em}
  .title{font-family:var(--serif);font-weight:300;font-size:2.5rem;line-height:1.05;margin:.75rem 0 1.25rem}
  .text{color:var(--taupe);max-width:42ch}
  .link{position:relative;display:inline-block;margin-top:1.6rem;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;padding-bottom:.35em;color:var(--ink)}
  .link::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .6s var(--ease)}
  .link:hover::after{transform:scaleX(1)}
</style>
</head>
<body>
  <span class="eyebrow">Components · Editorial Split</span>
  <div class="split">
    <div class="fig"><div class="ph"></div></div>
    <div>
      <span class="num">01</span>
      <h3 class="title">קבוצות קטנות,<br>תשומת לב מלאה</h3>
      <p class="text">עד שש תלמידות בכל מחזור. כל אחת מקבלת עיניים, זמן וליווי צמוד — כי מיומנות אמיתית נבנית מתוך תשומת לב, לא מתוך המונים.</p>
      <a href="#" class="link">על שיטת הלימוד</a>
    </div>
  </div>
</body>
</html>
