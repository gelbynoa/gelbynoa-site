<!-- @dsCard group="Components" name="Course Card" subtitle="Restrained · meta · serif title · no price-shouting" viewport="960x620" -->
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GelByNoa — Course Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300&family=Assistant:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--porcelain:#F7F3EE;--bone:#EFE8DF;--ink:#211C18;--taupe:#8B8078;--rose-deep:#A9857A;
    --serif:"Frank Ruhl Libre",Georgia,serif;--sans:"Assistant",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--porcelain);padding:56px}
  .eyebrow{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--rose-deep);display:block;margin-bottom:2rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;max-width:760px}
  .card{display:block;cursor:pointer}
  .fig{aspect-ratio:3/4;overflow:hidden;background:var(--bone);margin-bottom:1.25rem}
  .ph{width:100%;height:100%;transition:transform 1.1s var(--ease);
    background:radial-gradient(110% 90% at 20% 15%,#EEE7DF 0%,transparent 55%),linear-gradient(160deg,#DFD3C8 0%,#B9A79B 55%,#7E6F65 100%)}
  .ph--dark{background:radial-gradient(90% 80% at 70% 20%,#6B5A50 0%,transparent 60%),linear-gradient(150deg,#4A3F38 0%,#2E2723 70%)}
  .card:hover .ph{transform:scale(1.04)}
  .meta{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe)}
  .title{font-family:var(--serif);font-weight:300;font-size:2rem;margin:.75rem 0 .5rem}
  .desc{color:var(--taupe);max-width:38ch}
</style>
</head>
<body>
  <span class="eyebrow">Components · Course Card</span>
  <div class="grid">
    <a class="card">
      <div class="fig"><div class="ph"></div></div>
      <div class="meta"><span>מתחילות</span><span>שמונה מפגשים</span></div>
      <h3 class="title">היסוד · Foundations</h3>
      <p class="desc">הבסיס המלא של אמנות הג'ל — אחיזה, בנייה, צורה וגימור, נלמד לעומק ולאט.</p>
    </a>
    <a class="card">
      <div class="fig"><div class="ph ph--dark"></div></div>
      <div class="meta"><span>מתקדמות</span><span>עשרה מפגשים</span></div>
      <h3 class="title">מאסטריות · Mastery</h3>
      <p class="desc">טכניקות מתקדמות, סגנון אישי ואמנות חופשית — למי שכבר שולטת ורוצה יותר.</p>
    </a>
  </div>
</body>
</html>
