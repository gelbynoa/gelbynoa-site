<!-- @dsCard group="Components" name="Buttons & Links" subtitle="Ghost · rose · on-dark · hairline underline" viewport="960x520" -->
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GelByNoa — Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300&family=Assistant:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--porcelain:#F7F3EE;--ink:#211C18;--taupe:#8B8078;--rose-deep:#A9857A;--sand:#D8C7B8;
    --serif:"Frank Ruhl Libre",Georgia,serif;--sans:"Assistant",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--porcelain);padding:56px}
  .eyebrow{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--rose-deep)}
  h1{font-family:var(--serif);font-weight:300;font-size:2.2rem;margin:.4rem 0 2.4rem}
  .lbl{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe);margin:26px 0 14px}
  .cluster{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:1.15em 2.4em;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;transition:background .8s var(--ease),color .8s var(--ease)}
  .btn:hover{background:var(--ink);color:var(--porcelain)}
  .btn--rose{border-color:var(--rose-deep);color:var(--rose-deep)}
  .btn--rose:hover{background:var(--rose-deep);color:var(--porcelain)}
  .dark{background:#2E2723;padding:34px 40px;margin-top:8px}
  .btn--light{border-color:rgba(247,243,238,.6);color:var(--porcelain)}
  .btn--light:hover{background:var(--porcelain);color:var(--ink);border-color:var(--porcelain)}
  .link{position:relative;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;padding-bottom:.35em;color:var(--ink)}
  .link::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .6s var(--ease)}
  .link:hover::after{transform:scaleX(1)}
</style>
</head>
<body>
  <span class="eyebrow">Components</span>
  <h1>Buttons &amp; Links</h1>

  <div class="lbl">Ghost · primary</div>
  <div class="cluster">
    <button class="btn">לצפייה בקורסים</button>
    <button class="btn btn--rose">לשיחת ייעוץ אישית</button>
  </div>

  <div class="lbl">On dark surface</div>
  <div class="cluster dark">
    <button class="btn btn--light">להצטרפות</button>
    <button class="btn btn--light">גלריית הבוגרות</button>
  </div>

  <div class="lbl">Hairline underline link</div>
  <div class="cluster">
    <a href="#" class="link">על שיטת הלימוד</a>
    <a href="#" class="link">הכירו את נועה</a>
  </div>
</body>
</html>
