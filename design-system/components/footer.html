<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GelByNoa — Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300&family=Assistant:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--porcelain:#F7F3EE;--ink:#211C18;--rose:#C7A79C;
    --serif:"Frank Ruhl Libre",Georgia,serif;--sans:"Assistant",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);font-weight:300;background:var(--porcelain)}
  .footer{background:var(--ink);color:var(--porcelain);padding:72px 56px 40px}
  .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:52px}
  .brand{font-family:var(--serif);font-size:2rem;letter-spacing:.12em}
  .tag{color:rgba(247,243,238,.6);max-width:32ch;margin-top:.75rem;line-height:1.7}
  h4{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);margin-bottom:1.25rem;font-weight:400}
  a{display:block;padding:.35em 0;font-size:.92rem;color:rgba(247,243,238,.82);text-decoration:none}
  .base{display:flex;justify-content:space-between;margin-top:72px;padding-top:1.25rem;border-top:1px solid rgba(247,243,238,.14);font-size:.72rem;letter-spacing:.14em;color:rgba(247,243,238,.5)}
</style>
</head>
<body>
  <footer class="footer">
    <div class="grid">
      <div>
        <div class="brand">GelByNoa</div>
        <p class="tag">אקדמיה לאמנות הציפורניים. דיוק, אמנות וסטנדרט ללא פשרות — בית יוקרה לאמניות המודרניות.</p>
      </div>
      <div>
        <h4>ניווט</h4>
        <a>אודות נועה</a><a>הקורסים</a><a>בוגרות</a><a>גלריה</a><a>שאלות נפוצות</a>
      </div>
      <div>
        <h4>יצירת קשר</h4>
        <a>hello@gelbynoa.com</a><a>WhatsApp</a><a>Instagram</a><a>תל אביב</a>
      </div>
    </div>
    <div class="base">
      <span>© 2026 GelByNoa Academy</span>
      <span>עוצב כבית יוקרה · נבנה בעברית מהיסוד</span>
    </div>
  </footer>
</body>
</html>
