<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GelByNoa — Statement & Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:ital,wght@0,300;1,400&family=Assistant:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--porcelain:#F7F3EE;--bone:#EFE8DF;--ink:#211C18;--taupe:#8B8078;--rose-deep:#A9857A;--sand:#D8C7B8;
    --serif:"Frank Ruhl Libre",Georgia,serif;--sans:"Assistant",system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--porcelain)}
  .statement{text-align:center;padding:80px 56px}
  .statement__text{font-family:var(--serif);font-weight:300;font-size:3.2rem;line-height:1.25;max-width:18ch;margin-inline:auto}
  .statement__text em{font-style:italic;color:var(--rose-deep)}
  .quote{background:var(--bone);text-align:center;padding:80px 56px}
  .quote__mark{font-family:var(--serif);font-size:5rem;color:var(--sand);line-height:.3}
  .quote__text{font-family:var(--serif);font-weight:300;font-size:2.2rem;line-height:1.35;max-width:22ch;margin:2rem auto 1.25rem}
  .quote__author{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
</style>
</head>
<body>
  <section class="statement">
    <p class="statement__text">כאן לא לומדים מקצוע.<br>כאן נעשים <em>אמניות</em>.</p>
  </section>
  <section class="quote">
    <div class="quote__mark">”</div>
    <blockquote class="quote__text">הגעתי בשביל טכניקה. יצאתי עם ביטחון, סטנדרט ומקצוע.</blockquote>
    <p class="quote__author">— מאיה, בוגרת מחזור ג׳</p>
  </section>
</body>
</html>
