<!-- @dsCard group="Foundations" name="Spacing & Motion" subtitle="1.5 rhythm scale · expo-out easing" viewport="960x560" -->
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GelByNoa — Spacing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300&family=Assistant:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--porcelain:#F7F3EE;--ink:#211C18;--taupe:#8B8078;--rose:#C7A79C;--rose-deep:#A9857A;--sand:#D8C7B8;
    --serif:"Frank Ruhl Libre",Georgia,serif;--sans:"Assistant",system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--porcelain);padding:56px}
  .eyebrow{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--rose-deep)}
  h1{font-family:var(--serif);font-weight:300;font-size:2.2rem;margin:.4rem 0 2.2rem}
  .bar{display:flex;align-items:center;gap:20px;margin-bottom:14px}
  .bar__fill{height:22px;background:var(--rose)}
  .bar__label{font-size:.78rem;letter-spacing:.06em;color:var(--taupe);min-width:120px}
  .split{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:start}
  .motion{border-inline-start:1px solid var(--sand);padding-inline-start:40px}
  .motion h2{font-family:var(--serif);font-weight:300;font-size:1.4rem;margin-bottom:1rem}
  .motion p{color:var(--taupe);font-size:.92rem;line-height:1.9}
  code{font-family:ui-monospace,monospace;font-size:.82rem;background:#fff;padding:2px 8px;border:1px solid var(--sand)}
</style>
</head>
<body>
  <span class="eyebrow">Foundations</span>
  <h1>Spacing &amp; Motion</h1>
  <div class="split">
    <div>
      <div class="bar"><span class="bar__label">8 · s-1</span><div class="bar__fill" style="width:8px"></div></div>
      <div class="bar"><span class="bar__label">12 · s-2</span><div class="bar__fill" style="width:12px"></div></div>
      <div class="bar"><span class="bar__label">20 · s-3</span><div class="bar__fill" style="width:20px"></div></div>
      <div class="bar"><span class="bar__label">32 · s-4</span><div class="bar__fill" style="width:32px"></div></div>
      <div class="bar"><span class="bar__label">52 · s-5</span><div class="bar__fill" style="width:52px"></div></div>
      <div class="bar"><span class="bar__label">84 · s-6</span><div class="bar__fill" style="width:84px"></div></div>
      <div class="bar"><span class="bar__label">136 · s-7</span><div class="bar__fill" style="width:136px"></div></div>
      <div class="bar"><span class="bar__label">192 · s-8</span><div class="bar__fill" style="width:192px"></div></div>
    </div>
    <div class="motion">
      <h2>Motion</h2>
      <p>Slow, settled — never bouncy.<br><br>
      Easing <code>cubic-bezier(.16,1,.3,1)</code><br><br>
      Duration <code>0.8s</code> base<br><br>
      Reveals fade + rise 24px on scroll. Images scale to 1.04 over 1.1s. Respects <code>prefers-reduced-motion</code>.</p>
    </div>
  </div>
</body>
</html>
